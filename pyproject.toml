[project]
name = "django-tasks-service"
version = "0.1.0"
description = "Tasks API authenticated by Django-auth-service via JWKS"
requires-python = ">=3.14"
dependencies = ["django>=6.0.5,<7", "djangorestframework>=3.17.1,<4", "pyjwt[crypto]>=2.14,<3", "django-environ>=0.13", "psycopg[binary]>=3.3"]

[dependency-groups]
dev = ["pytest-django>=4.12", "ruff>=0.15"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
